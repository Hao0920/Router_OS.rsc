name: Build fwd

"on":
  schedule:
    - cron: '30 0 * * *'  # 每天 00:30 UTC（北京时间 08:30）
  workflow_dispatch:
  push:
    paths:
      - 'generators/fwd/**'

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate fwd .rsc file
        run: python generators/fwd/generate.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/fwd/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update fwd [skip ci]"
          git pull origin main --allow-unrelated-histories --no-rebase || true
          git push

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
