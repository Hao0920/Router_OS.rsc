name: Geph 节点列表监控

on:
  schedule:
    # UTC 每 6 小时第 17 分（避开整点高峰，GitHub 延迟更小）
    # 北京时间约 02:17 / 08:17 / 14:17 / 20:17
    - cron: "17 */6 * * *"
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: write          # 需要推送 data 分支

env:
  DATA_BRANCH: data        # 结果推送的目标分支（不存在会自动创建）

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install requests pynacl blake3

      - name: 生成并运行抓取脚本
        env:
          # 首次运行不设此变量；看日志拿到 broker 公钥指纹后，
          # 到 Settings -> Secrets and variables -> Actions -> Variables 添加 GEPH_PIN
          GEPH_PIN: ${{ vars.GEPH_PIN }}
        run: |
          cat > /tmp/geph_nodes.py << 'PYEOF'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          import argparse, base64, hashlib, json, sys

          import requests
          from nacl.signing import VerifyKey
          from nacl.exceptions import BadSignatureError
          import blake3

          BROKER = "https://broker.geph.io/"
          METHOD = "get_net_status"


          def parse_bytes(value, what):
              """兼容字节数组的三种序列化: int数组 / hex / base64。"""
              if isinstance(value, list):
                  return bytes(v & 0xFF for v in value)
              if isinstance(value, str):
                  s = value.strip()
                  for dec in (lambda: bytes.fromhex(s),
                              lambda: base64.b64decode(s + "=" * (-len(s) % 4)),
                              lambda: base64.urlsafe_b64decode(s + "=" * (-len(s) % 4))):
                      try:
                          return dec()
                      except Exception:
                          continue
              raise ValueError(f"无法解析 {what} 格式: {type(value).__name__} {str(value)[:80]}")


          def get_net_status():
              payload = {"jsonrpc": "2.0", "method": METHOD, "params": [], "id": 0}
              r = requests.post(BROKER, json=payload, timeout=20)
              r.raise_for_status()
              return r.json()


          def verify_json_signed(resp, key_pin=None):
              inner = resp.get("inner")
              sig = resp.get("signature")
              if inner is None or sig is None:
                  raise ValueError(f"响应缺少 inner/signature 字段: {list(resp.keys())}")

              inner_bytes = json.dumps(inner, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
              digest = blake3.blake3(inner_bytes, key=blake3.blake3(b"net-status").digest()).digest()

              raw_sig = parse_bytes(sig, "signature")
              key_b64 = None
              if isinstance(inner, dict):
                  ns = inner.get("net_status", inner)
                  key_b64 = ns.get("key") or inner.get("key")
              if key_b64 is None:
                  raise ValueError("inner 中找不到验签公钥 key 字段，请把原始响应发我调整解析")
              raw_key = parse_bytes(key_b64, "key")

              VerifyKey(raw_key).verify(digest, raw_sig)  # 失败抛 BadSignatureError

              fp = hashlib.sha256(raw_key).hexdigest()[:16]
              if key_pin:
                  if raw_key.hex().lower() != key_pin.lower():
                      sys.exit(f"!! 公钥与 pin 不匹配 !!\n  本次指纹: {fp}\n  固定 pin: {key_pin}")
                  print(f"[pin] 公钥校验通过 (sha256 前16位: {fp})")
              return inner, raw_key, fp


          def print_exits(inner, fp):
              ns = inner.get("net_status", inner)
              exits = ns.get("exits", {})
              if not isinstance(exits, dict):
                  exits = {str(i): e for i, e in enumerate(exits)}

              rows = []
              for pubkey, e in exits.items():
                  rows.append({
                      "国家": (e.get("country") or "??").upper(),
                      "城市": e.get("city") or "?",
                      "负载": e.get("task") if e.get("task") is not None else e.get("load", -1),
                      "等级": "PLUS" if e.get("plus_only") or (e.get("allowed_levels") == ["plus"]) else "免费",
                      "类别": ",".join(e.get("category") or []) or "-",
                      "直连地址": e.get("c2e_listen") or e.get("direct") or "-",
                  })
              rows.sort(key=lambda r: (r["等级"] != "免费",
                                       r["负载"] if isinstance(r["负载"], (int, float)) else 999))

              print(f"\nbroker 验签公钥 sha256 前16位: {fp}   <-- 首次运行请核实后到仓库 Variables 设 GEPH_PIN\n")
              hdr = f"{'国家':<4} {'城市':<14} {'负载%':>6} {'等级':<5} {'类别':<8} 直连地址"
              print(hdr); print("-" * 70)
              for r in rows:
                  load = r["负载"]
                  load_s = f"{load * 100:.0f}%" if isinstance(load, float) and load <= 1 else str(load)
                  print(f"{r['国家']:<4} {r['城市']:<14} {load_s:>6} {r['等级']:<5} {r['类别']:<8} {r['直连地址']}")
              print(f"\n共 {len(rows)} 个出口节点")


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--pin")
              ap.add_argument("--json", metavar="FILE")
              args = ap.parse_args()

              inner, raw_key, fp = verify_json_signed(get_net_status(), key_pin=args.pin)
              print_exits(inner, fp)
              if args.json:
                  with open(args.json, "w", encoding="utf-8") as f:
                      json.dump({"broker_key_hex": raw_key.hex(), "verified_inner": inner},
                                f, ensure_ascii=False, indent=2)


          if __name__ == "__main__":
              main()
          PYEOF

          if [ -n "$GEPH_PIN" ]; then
            python3 /tmp/geph_nodes.py --pin "$GEPH_PIN" --json net_status.json
          else
            python3 /tmp/geph_nodes.py --json net_status.json
          fi

      - name: 推送到 data 分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$DATA_BRANCH" 2>/dev/null || true
          git checkout -B "$DATA_BRANCH" "origin/$DATA_BRANCH" 2>/dev/null || git checkout --orphan "$DATA_BRANCH"
          mkdir -p net
          mv net_status.json net/net_status.json
          cp net/net_status.json "net/$(date -u +%Y%m%d_%H%M%S).json"
          # 历史快照只保留最近 200 份，避免仓库无限膨胀
          ls -1t net/2*.json 2>/dev/null | tail -n +201 | xargs -r rm -f
          git add net/
          git commit -m "节点状态 $(date -u +%Y-%m-%dT%H:%M:%SZ)" || exit 0
          git push -u origin "$DATA_BRANCH"
