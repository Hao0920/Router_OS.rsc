name: Build adlist

"on":
  schedule:
    - cron: '30 0 * * *'  # 每天 00:30 UTC（北京时间 08:30）
  workflow_dispatch:
  push:
    paths:
      - 'generators/adlist/**'

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clean old files
        run: |
          git rm -rf output/adlist/*.txt output/adlist/*.rsc 2>/dev/null || true
          mkdir -p output/adlist

      - name: Generate adlist files
        run: python generators/adlist/generate.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/adlist/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update adlist [skip ci]"
          git pull origin main --allow-unrelated-histories --no-rebase || true
          git push

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
