name: Build chnroute

"on":
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'generators/chnroute/**'

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，避免推送冲突

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clean old .rsc files
        run: |
          # 删除所有已跟踪的 .rsc 文件
          git rm -rf output/chnroute/*.rsc 2>/dev/null || true
          # 确保目录存在但为空
          mkdir -p output/chnroute

      - name: Generate chnroute .rsc files
        run: python generators/chnroute/generate.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/chnroute/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update chnroute [skip ci]"
          # 先拉取远程更改，允许不相关历史合并
          git pull origin main --allow-unrelated-histories --no-rebase || true
          git push

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
