name: Build chnroute

"on":
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'generators/chnroute/**'

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean old .rsc files
        run: |
          rm -f output/chnroute/*.rsc || true
          git rm --ignore-unmatch -f output/chnroute/*.rsc || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate chnroute .rsc files
        run: python generators/chnroute/generate.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/chnroute/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update chnroute [skip ci]"
          git push

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
